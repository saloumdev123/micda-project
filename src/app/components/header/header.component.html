    <header class="header">
      <div class="container">
        <div class="nav-brand" (click)="navigateTo('/')">
          <div class="logo">
            <span class="logo-symbol">☪</span>
            <span class="logo-text">Ramli</span>
          </div>
          <span class="subtitle">Science Divinatoire</span>
        </div>
        
        <nav class="nav-menu" *ngIf="isAuthenticated">
        <a (click)="navigateTo('/dashboard')" class="nav-link">
          <span class="nav-icon"><i class="fas fa-home"></i></span>
          Accueil
        </a>
        <a (click)="navigateTo('/tirage')" class="nav-link">
          <span class="nav-icon"><i class="fas fa-magic"></i></span>
          Nouveau Tirage
        </a>
        <a (click)="navigateTo('/historique')" class="nav-link">
          <span class="nav-icon"><i class="fas fa-book"></i></span>
          Historique
        </a>
        <div class="user-menu">
          <div class="user-info" (click)="toggleUserMenu()">
            <span class="user-avatar">{{ getCurrentUserInitials() }}</span>
            <span class="user-name">{{ currentUser?.prenom }}</span>
            <span class="dropdown-arrow"><i class="fas fa-caret-down"></i></span>
          </div>
          <div class="user-dropdown" [class.active]="showUserMenu">
            <a (click)="navigateTo('/profile')" class="dropdown-item">
              <span class="dropdown-icon"><i class="fas fa-user"></i></span>
              Mon Profil
            </a>
            <a (click)="logout()" class="dropdown-item logout">
              <span class="dropdown-icon"><i class="fas fa-sign-out-alt"></i></span>
              Déconnexion
            </a>
          </div>
        </div>
      </nav>

      </div>
    </header>
