<div class="auth-container mystical-pattern">
  <div class="auth-card card fade-in">
    <div class="auth-header">
      <h1 class="auth-title">Réinitialiser le mot de passe</h1>
      <p class="auth-subtitle">Entrez votre nouveau mot de passe</p>
    </div>

    <form (ngSubmit)="onSubmit()" class="auth-form">
      <div class="input-group">
        <label for="newPassword">Nouveau mot de passe</label>
        <input id="newPassword" type="password" [(ngModel)]="newPassword" name="newPassword" class="form-input" required />
      </div>

      <div class="input-group">
        <label for="confirmPassword">Confirmer le mot de passe</label>
        <input id="confirmPassword" type="password" [(ngModel)]="confirmPassword" name="confirmPassword" class="form-input" required />
      </div>

      <button type="submit" class="btn btn-primary auth-button" [disabled]="loading">
        {{ loading ? 'Réinitialisation...' : 'Réinitialiser le mot de passe' }}
      </button>
    </form>
  </div>
</div>
